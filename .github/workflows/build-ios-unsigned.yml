name: Build unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and sync iOS
        run: |
          npm run build
          npx cap sync ios

      - name: Read iOS version
        id: version
        run: |
          version_code="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION = ([^;]+);.*$/\1/p' ios/App/App.xcodeproj/project.pbxproj | head -n 1)"
          version_name="$(sed -nE 's/^[[:space:]]*MARKETING_VERSION = ([^;]+);.*$/\1/p' ios/App/App.xcodeproj/project.pbxproj | head -n 1)"
          test -n "$version_code"
          test -n "$version_name"
          printf 'version_code=%s\nversion_name=%s\n' "$version_code" "$version_name" >> "$GITHUB_OUTPUT"

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/BabyLinkDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            clean build

      - name: Package IPA
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          app="$RUNNER_TEMP/BabyLinkDerivedData/Build/Products/Release-iphoneos/App.app"
          test -d "$app"
          find "$app" -name embedded.mobileprovision -delete
          find "$app" -type d -name _CodeSignature -prune -exec rm -rf {} +
          xattr -cr "$app"
          find "$app" \( -type d \( -name '*.app' -o -name '*.appex' -o -name '*.framework' -o -name '*.bundle' \) -o -type f -perm -111 \) -print0 | while IFS= read -r -d '' code; do
            codesign --remove-signature "$code" 2>/dev/null || true
          done
          find "$app" -type d -name _CodeSignature -prune -exec rm -rf {} +
          executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          lipo "$app/$executable_name" -verify_arch arm64
          staging="$RUNNER_TEMP/BabyLinkIpa"
          rm -rf "$staging"
          mkdir -p "$staging/Payload" build
          COPYFILE_DISABLE=1 ditto --noqtn --norsrc "$app" "$staging/Payload/BabyLink.app"
          find "$staging" \( -name '.DS_Store' -o -name '._*' -o -name embedded.mobileprovision \) -delete
          xattr -cr "$staging/Payload/BabyLink.app"
          find "$staging/Payload" -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$staging/Payload" -type f -print0 | while IFS= read -r -d '' code; do
            if file -b "$code" | grep -q 'Mach-O'; then
              codesign --remove-signature "$code" 2>/dev/null || true
            fi
          done
          find "$staging/Payload" -depth -type d \( -name '*.app' -o -name '*.appex' -o -name '*.framework' -o -name '*.bundle' -o -name '*.xpc' \) -print0 | while IFS= read -r -d '' code; do
            codesign --remove-signature "$code" 2>/dev/null || true
          done
          find "$staging/Payload" -type d -name _CodeSignature -prune -exec rm -rf {} +
          output="BabyLink-unsigned-$VERSION_NAME.ipa"
          rm -f "build/$output" "build/$output.sha256"
          (cd "$staging" && COPYFILE_DISABLE=1 /usr/bin/zip -qry -X "$GITHUB_WORKSPACE/build/$output" Payload)
          unzip -tq "build/$output"
          test "$(unzip -Z1 "build/$output" | grep -Ec '^Payload/[^/]+\.app/$')" = 1
          if unzip -Z1 "build/$output" | grep -Eq '(^|/)(__MACOSX|\.DS_Store|\._|embedded\.mobileprovision)'; then
            echo 'IPA contains signing or macOS metadata that can break external re-signers.' >&2
            exit 1
          fi
          if find "$staging/Payload" -type d -name _CodeSignature -print -quit | grep -q .; then
            echo 'IPA still contains a nested code signature.' >&2
            exit 1
          fi
          find "$staging/Payload" -type f -print0 | while IFS= read -r -d '' code; do
            if ! file -b "$code" | grep -q 'Mach-O'; then
              continue
            fi
            if codesign -dvvv "$code" 2>&1 | grep -Eq '^(Signature|CodeDirectory)='; then
              echo "IPA still contains a Mach-O signature on $code." >&2
              exit 1
            fi
          done
          (cd build && shasum -a 256 "$output" | tee "$output.sha256")

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BabyLink-unsigned-${{ steps.version.outputs.version_name }}
          path: |
            build/BabyLink-unsigned-${{ steps.version.outputs.version_name }}.ipa
            build/BabyLink-unsigned-${{ steps.version.outputs.version_name }}.ipa.sha256
          if-no-files-found: error
          retention-days: 14
